services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ragchat
      POSTGRES_PASSWORD: ragchat
      POSTGRES_DB: ragchat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragchat -d ragchat"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://ragchat:ragchat@db:5432/ragchat
    volumes:
      - ./backend/data/uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
